{% extends "base.html" %}

{% block title %}设置 - NewsAgent{% endblock %}

{% block content %}
<div class="panel">
    <div class="panel-header">
        <h2>系统配置</h2>
    </div>
    <table>
        <thead>
            <tr>
                <th>配置项</th>
                <th>当前值</th>
            </tr>
        </thead>
        <tbody>
            {% for key, value in config.items() %}
            <tr>
                <td><strong>{{ key }}</strong></td>
                <td>{{ value }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
