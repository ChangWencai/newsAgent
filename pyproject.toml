[project]
name = "newsagent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "anthropic>=0.20.0",
    "playwright>=1.40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
